# qCore — network intelligence rules
#
# A rule fires only when ALL of its conditions match. Every rule is separately
# bounded by a cooldown and by max-executions-per-hour per node, and every
# action is written to qcore_automation_audit.
#
# Metrics available to conditions:
#   tps, mspt, onlinePlayers, maxPlayers, capacityUtilisation,
#   heapUtilisation, statusDegraded, networkPlayers, networkUtilisation
#
# Operators: GREATER_THAN, GREATER_OR_EQUAL, LESS_THAN, LESS_OR_EQUAL,
#            EQUALS, NOT_EQUALS
#
# Actions: MARK_STATUS (status: ONLINE | DEGRADED | OVERLOADED),
#          EMIT_EVENT, NOTIFY (logs a warning)

rules:
  - id: overloaded-when-slow-and-busy
    description: "Mark a server overloaded when TPS collapses while it is busy"
    enabled: true
    priority: 100
    cooldown: PT60S
    max-executions-per-hour: 20
    conditions:
      - metric: tps
        operator: LESS_THAN
        value: 15.0
      - metric: capacityUtilisation
        operator: GREATER_OR_EQUAL
        value: 0.85
    actions:
      - type: MARK_STATUS
        status: OVERLOADED
      - type: EMIT_EVENT

  - id: degrade-on-memory-pressure
    description: "Degrade a server before it runs out of heap"
    enabled: true
    priority: 80
    cooldown: PT120S
    max-executions-per-hour: 10
    conditions:
      - metric: heapUtilisation
        operator: GREATER_OR_EQUAL
        value: 0.92
    actions:
      - type: MARK_STATUS
        status: DEGRADED
      - type: NOTIFY

  - id: recover-when-healthy
    description: "Return a throttled server to ONLINE once it has recovered"
    enabled: true
    priority: 10
    cooldown: PT60S
    max-executions-per-hour: 30
    conditions:
      - metric: statusDegraded
        operator: EQUALS
        value: 1.0
      - metric: tps
        operator: GREATER_OR_EQUAL
        value: 19.5
      - metric: capacityUtilisation
        operator: LESS_THAN
        value: 0.70
    actions:
      - type: MARK_STATUS
        status: ONLINE
