# qCore — server node identity
#
# The id must match the secret configured for this node in central's security.yml
# and must be unique across the network. Only letters, digits, dot, dash and
# underscore are allowed.

server:
  id: "lobby-1"
  name: "lobby-1"
  # Address the proxy should transfer players to. Leave host empty to use the
  # address this server reports for itself.
  host: "127.0.0.1"
  port: 25565
  # Optional group used by routing requests ("lobby", "survival", ...).
  game-mode: "lobby"
  # Higher weight makes the router prefer this server when everything else is equal.
  weight: 10
  tags:
    - lobby
  accepting-players: true
